name: docker

# The container's image (docs/docker.md), built and tried with
# docker/smoke.sh: what's in it runs, and the server answers with the web
# app built in.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's own Docker builds it (BuildKit is built in), so nothing
      # comes from Docker Hub, whose limits on shared runners kept failing
      # this job: buildx's builder image is pulled from there, and the base
      # images come from AWS's mirror (the Dockerfile's BASE).
      - run: docker build -t lattice:ci .
      - run: docker/smoke.sh lattice:ci
      - name: Say how big it is
        run: docker image ls lattice:ci --format '{{.Size}}'
