[package]
name = "lattice"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A code wiki for your own repositories, written by Claude Code and kept up to date"
license = "MIT"
repository = "https://github.com/gabalexander/lattice"
readme = "README.md"
keywords = ["wiki", "documentation", "claude", "code", "diagrams"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = "1.1.6"
# The symbol index reads definitions out of Rust, Go, Python, TypeScript and
# JavaScript, Java, C and C++ with their tree-sitter grammars, about 8 MB of
# the binary; other languages are read by their keywords (docs/index.md).
tree-sitter = "0.26.13"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "eval"
path = "evals/eval.rs"
